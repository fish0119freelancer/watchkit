[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "watchkit"
version = "0.1.0"
description = "Public data watch and daily HTML report framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"

[project.scripts]
watchkit = "watchkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
